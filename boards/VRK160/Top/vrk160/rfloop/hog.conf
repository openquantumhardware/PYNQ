#vivado 2025.2
# Hog project: VRK160 rfloop overlay (Segmented Configuration).
#
# The Hog root for this repository is boards/VRK160 -- the directory holding
# Hog/ and Top/ -- so every path in list/ is relative to boards/VRK160.
#
# PART and BOARD_PART are declared here because golden_ref.tcl only sets them
# inside its "if {$list_projs eq {}}" guard, which does not fire under Hog:
# Hog has already created the project by the time proj.tcl runs.

[main]
PART=xcvr1602-vsva2488-2MP-e-S-es1
BOARD_PART=xilinx.com:vrk160:part0:1.1
TARGET_LANGUAGE=Verilog
SIM.USE_IP_COMPILED_LIBS=0
